name: Release

# 打 tag（v*）就自动构建并发 Release；也可以在 Actions 页面手动指定一个已存在的 tag 跑。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.7.0，必须已经存在）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # runner 自带 Android SDK，但 platform 37 目前只在 canary 频道，所以要自己装。
      # 这里先打印两个频道里到底有什么，再依次尝试，装完把目录列出来，方便排错。
      - name: 安装 Android SDK 组件（platform 37）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls "$SDK" || true
          CM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager=$CM"
          "$CM" --version || true
          yes | "$CM" --licenses >/dev/null 2>&1 || true
          echo "--- 稳定频道里的 android-3x 平台 ---"
          "$CM" --list 2>/dev/null | grep -E "platforms;android-3[0-9]" | sort -u || true
          echo "--- canary 频道里的 android-37 ---"
          "$CM" --channel=3 --list 2>/dev/null | grep -E "platforms;android-37" | sort -u || true
          "$CM" --install "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" \
            || "$CM" --channel=3 --install "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" \
            || "$CM" --install "platform-tools" "build-tools;37.0.0" "platforms;android-37"
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: 准备签名文件（从 Secrets 还原，仓库里不放 keystore）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 Secrets：需要在仓库 Settings → Secrets and variables → Actions 里配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            exit 1
          fi
          mkdir -p ci-keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ci-keys/shitu-release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/ci-keys/shitu-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ci-keys/shitu-release.properties

      - name: 单测 + 打包 release
        run: |
          chmod +x ./gradlew   # 仓库在 Windows 上提交的，保险起见补一下可执行位
          ./gradlew --no-daemon \
            -Pshitu.signingProperties="$GITHUB_WORKSPACE/ci-keys/shitu-release.properties" \
            :app:testDebugUnitTest :app:assembleRelease

      - name: 单测报告（失败时也能下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: 按版本号重命名 APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "shitu-$VER.apk"
          ls -lh "shitu-$VER.apk"
          echo "file=shitu-$VER.apk" >> "$GITHUB_OUTPUT"

      - name: 从 CHANGELOG 里取本版说明
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          awk -v h="## $VER" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f{print}' docs/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "本版没有单独写在 CHANGELOG 里的说明，点上面的 Full Changelog 看改了哪些提交。" > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: 建/更新 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          fail_on_unmatched_files: true
